name: Release

# Pushing a tag like v0.1.0 builds the package and attaches it to a GitHub
# Release as rpn-typesetter.tgz, so authors can install or update with
#   npm install -g https://github.com/vedoge/rpn-typesetter/releases/latest/download/rpn-typesetter.tgz

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Pack
        run: |
          npm pack
          mv rpn-typesetter-*.tgz rpn-typesetter.tgz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rpn-typesetter.tgz --title "$GITHUB_REF_NAME" --generate-notes
