name: Release

# Builds the package and attaches it to a GitHub Release as
# rpn-typesetter.tgz, so authors can install or update with
#   npm install -g https://github.com/vedoge/rpn-typesetter/releases/latest/download/rpn-typesetter.tgz
#
# Either push a tag like v0.1.0 matching package.json's version, or run this
# workflow by hand on main ("Run workflow"): it then tags the commit
# v<version> itself.
#
# The ctan job then attaches rpn-typesetter-ctan.zip, the LuaLaTeX package as
# CTAN takes it, to the same release, ready to upload at ctan.org/upload.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Work out the tag
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match package.json ($tag)"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Pack
        run: |
          npm pack
          mv rpn-typesetter-*.tgz rpn-typesetter.tgz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" rpn-typesetter.tgz --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  ctan:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaLaTeX
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-luatex
      - name: Build the CTAN upload
        run: sh scripts/ctan.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$(node -p 'require("./package.json").version')" rpn-typesetter-ctan.zip
