name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  latex:
    name: Compile with pdfLaTeX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install TeX Live
        run: |
          # Skip rebuilding the manual-page index after install, which is slow on runners.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended latexmk
      - run: npm ci
      # With pdflatex installed, test/latex.test.ts compiles every expected
      # output in test/cases/; REQUIRE_LATEX makes it fail rather than skip.
      - run: npm test
        env:
          REQUIRE_LATEX: "1"
      - name: Typeset the example through latexmk, as an author would
        run: |
          npm run build
          npm link
          cd examples
          latexmk -interaction=nonstopmode -halt-on-error demo.rtex
          head -1 demo.tex
      - name: Upload the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            examples/demo.tex
            examples/demo.pdf
            examples/demo.log
          if-no-files-found: ignore
